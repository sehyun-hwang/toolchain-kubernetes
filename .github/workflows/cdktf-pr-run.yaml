name: pr.run
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [experiment/cdktn-deploy-applications]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number
        required: true
        type: string
concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  enqueue:
    if: github.repository == vars.CDKTF_PIPELINE_REPOSITORY && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    outputs:
      request: ${{ steps.envelope.outputs.request }}
    steps:
      - name: Preserve original Actions event in bounded metadata envelope
        id: envelope
        env:
          OPERATION: pr.run
        shell: python
        run: |
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          envelope = {'schemaVersion': 1, 'operation': os.environ['OPERATION'],
                      'eventName': os.environ['GITHUB_EVENT_NAME'],
                      'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
                      'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'event': event}
          body = json.dumps(envelope, ensure_ascii=False, separators=(',', ':')).encode()
          if len(body) > 1024 * 1024:
              raise SystemExit('Event exceeds SQS 1 MiB body limit; not enqueued')
          Path('request.json').write_bytes(body)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"request={envelope['operation']}:{envelope['workflowRunId']}:{envelope['workflowRunAttempt']}\n")
      - name: Assume metadata-only queue role
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ vars.CDKTF_PIPELINE_DISPATCH_ROLE_ARN }}
          aws-region: ${{ vars.CDKTF_PIPELINE_REGION }}
      - name: Enqueue without credentials or checkout
        env:
          QUEUE_URL: ${{ vars.CDKTF_PIPELINE_QUEUE_URL }}
        run: aws sqs send-message --queue-url "$QUEUE_URL" --message-body file://request.json --query MessageId --output text
  wait:
    needs: enqueue
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      head_sha: ${{ steps.prepare.outputs.head_sha }}
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for correlated runner preparation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ needs.enqueue.outputs.request }}
          REPOSITORY: ${{ github.repository }}
          OPERATION: pr.run
          CHECK_NAME: 'CI / Prepare'
        shell: python
        run: |
          import json, os, subprocess, time
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          if os.environ['OPERATION'] == 'baseline.publish':
              sha = event.get('after') or os.environ['GITHUB_SHA']
          else:
              number = event.get('pull_request', {}).get('number') or event['inputs']['pr_number']
              pr = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['REPOSITORY']}/pulls/{number}" ]))
              sha = event.get('pull_request', {}).get('head', {}).get('sha') or pr['head']['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'head_sha={sha}\n')
          deadline = time.monotonic() + 2100
          while time.monotonic() < deadline:
              result = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['REPOSITORY']}/commits/{sha}/check-runs?filter=all&per_page=100", '--paginate', '--slurp']))
              matches = [c for page in result for c in page['check_runs'] if c.get('external_id') == 'lifecycle:' + os.environ['REQUEST'] and c.get('app', {}).get('id') == 5231328 and c.get('name') == os.environ['CHECK_NAME'] and c.get('head_sha') == sha]
              if matches and matches[0]['status'] == 'completed':
                  print(matches[0]['html_url'])
                  raise SystemExit(0 if matches[0]['conclusion'] == 'success' else 1)
              time.sleep(15)
          raise SystemExit('No correlated terminal application result within 35 minutes')
  execute:
    needs: wait
    runs-on: [self-hosted, "ci-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout exact validated head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.wait.outputs.head_sha }}
          persist-credentials: false
      - name: Install exact dependencies and synthesize
        working-directory: ci-fixture
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec tsx --test tests/*.test.ts
          pnpm exec cdktn synth fixture-app
      - name: Apply and test the prepared clone
        working-directory: ci-fixture
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=cdktf.out/stacks/fixture-app init -input=false
          terraform -chdir=cdktf.out/stacks/fixture-app apply -input=false -auto-approve
          bash tests/application.sh
